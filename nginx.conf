# Serves the viewer under /view, which Nginx Proxy Manager forwards here unchanged
# (Custom Location /view on the tab.aabder.xyz proxy host). Everything else goes to the API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Share links look like /view#token (no trailing slash); the fragment never reaches the server.
    location = /view {
        try_files /view/index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # MapLibre's worker is an ES module (.mjs), which this nginx's mime.types doesn't know;
    # browsers refuse to start a module worker served as application/octet-stream.
    location ~ ^/view/assets/.+\.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Hashed build output: cache for a long time.
    location /view/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /view/ {
        try_files $uri /view/index.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
